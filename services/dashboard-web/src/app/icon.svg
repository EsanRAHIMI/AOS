<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- App icon (D-188b). Next serves this as the favicon, which stops the
       browser's automatic /favicon.ico request from 404ing on every page.
       Mirrors the sidebar `.logo` mark: accent→accent-2 gradient, r-9/26 ≈ 22/64. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="22" fill="url(#g)"/>
  <circle cx="32" cy="32" r="9" fill="#070a12" opacity="0.92"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#070a12" stroke-opacity="0.35" stroke-width="3"/>
</svg>
